description = 'ubi 8 builder with no buildpacks included. To use, specify buildpacks at build time.'

[lifecycle]
version = '0.21.29'

[build]
image = 'docker.io/paketobuildpacks/build-ubi8-base:0.0.327'

[run]
[[run.images]]
image = 'docker.io/paketobuildpacks/run-ubi8-base:latest'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'

[[targets]]
os = 'linux'
arch = 'ppc64le'

[[targets]]
os = 'linux'
arch = 's390x'
